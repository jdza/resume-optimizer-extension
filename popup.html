<!DOCTYPE html>
<html>
  <head>
    <title>Resume Optimizer</title>
    <style>
      body {
        width: 400px;
        padding: 20px;
        font-family: Arial, sans-serif;
      }
      .container {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      button {
        padding: 10px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background-color: #45a049;
      }
      .error {
        color: red;
        margin-top: 5px;
      }
      .success {
        color: green;
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Resume Optimizer</h2>
      <button id="optimize">Optimize Resume</button>
      <div id="status"></div>
      <a href="#" id="openFullPage" style="margin-top:10px; text-align:center; display:block;">Upload/Update Resume</a>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
